<!doctype html>
<html lang="en" class="h-full bg-gray-100">
  <head>
    <meta charset="utf-8" />
    <title>AfidingCapital</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" type="image/x-icon" href="assets/images/AClogo.png" />
  <link rel="icon" type="image/png" href="assets/images/AClogo.png" sizes="182x184" />
    <link rel="apple-touch-icon" type="image/png" href="assets/images/AClogo.png" sizes="182x184" />
    <link rel="manifest" href="manifest.json" />

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Mono:300" rel="stylesheet" />
    <!-- Load environment variables -->
    <script src="assets/env.js"></script>
  </head>
  <body class="h-full">
    <!--[if lt IE 10]>
      <p>
        You are using an <strong>outdated</strong> browser. Please
        <a href="http://browsehappy.com/">upgrade your browser</a> to improve your experience.
      </p>
    <![endif]-->

    <noscript>
      <p>This page requires JavaScript to work properly. Please enable JavaScript in your browser.</p>
    </noscript>

    <script>
      // This hides the address bar on mobile browsers
      // https://developers.google.com/web/fundamentals/native-hardware/fullscreen/
      window.addEventListener('load', function () {
        window.scrollTo(0, 1);
      });
    </script>

    <mifosx-web-app>
      <style>
        .loader-wrapper {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background: transparent;
        }
        .loader-logo {
          width: 160px;
          height: 160px;
          animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
          0% {
            transform: scale(1);
            opacity: 1;
          }
          50% {
            transform: scale(1.15);
            opacity: 0.7;
          }
          100% {
            transform: scale(1);
            opacity: 1;
          }
        }
      </style>
      <div class="loader-wrapper">
        <img src="assets/images/logo.png" alt="Logo" class="loader-logo" />
      </div>
    </mifosx-web-app>
  </body>
</html>
